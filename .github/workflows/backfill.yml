name: AQI Backfill Pipeline (Airflow via Docker)

on:
  workflow_dispatch:
    inputs:
      months:
        description: "Nombre de mois d'historique à récupérer"
        required: true
        default: "12"
        type: choice
        options:
          - "3"
          - "6"
          - "12"

permissions:
  contents: write

concurrency:
  group: aqi-backfill
  cancel-in-progress: false

jobs:
  run-backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix permissions for mounted volumes
        run: |
          mkdir -p raw clean logs plugins docs config
          sudo chown -R 50000:0 raw clean logs plugins docs config
          sudo chmod -R 775 raw clean logs plugins docs config

      - name: Create .env file
        run: |
          echo "OPENWEATHER_API_KEY=${{ secrets.OPENWEATHER_API_KEY }}" >> .env
          echo "DATABASE_URL=${{ secrets.NEON_DATABASE_URL }}" >> .env
          echo "DATABASE_URL_WRITER=${{ secrets.NEON_DATABASE_URL_WRITER }}" >> .env
          echo "AIRFLOW_UID=50000" >> .env

      - name: Start Airflow with Docker Compose
        run: |
          docker compose up -d --wait --wait-timeout 180

      - name: Check container status
        run: |
          docker compose ps

      - name: Wait for DAG discovery
        run: |
          sleep 30
          docker compose exec -T airflow-webserver \
            airflow dags list | grep aqi_pipeline

      - name: Calculate dates
        id: dates
        run: |
          END_DATE=$(date +%Y-%m-%d)
          START_DATE=$(date --date="$END_DATE - ${{ inputs.months }} months" +%Y-%m-%d 2>/dev/null || date -d "$END_DATE - ${{ inputs.months }} months" +%Y-%m-%d)

          echo "start_date=$START_DATE" >> $GITHUB_OUTPUT
          echo "end_date=$END_DATE" >> $GITHUB_OUTPUT

      - name: Debug dates
        run: |
          echo "Start date: ${{ steps.dates.outputs.start_date }}"
          echo "End date: ${{ steps.dates.outputs.end_date }}"

      - name: Debug DAG
        run: |
          docker compose exec -T airflow-webserver \
            airflow dags details aqi_pipeline

      - name: Run backfill
        run: |
          docker compose exec -T airflow-webserver \
            airflow backfill create \
            --dag-id aqi_pipeline \
            --from-date "${{ steps.dates.outputs.start_date }}" \
            --to-date "${{ steps.dates.outputs.end_date }}"

      - name: Commit raw/ et clean/
        run: |
          git config user.name "aqi-bot"
          git config user.email "aqi-bot@users.noreply.github.com"
          git config core.fileMode false

          git add raw/ clean/

          git diff --staged --quiet || \
          git commit -m "chore: backfill ${{ steps.dates.outputs.start_date }} -> ${{ steps.dates.outputs.end_date }}"

          git pull --rebase
          git push

      - name: Show logs
        if: always()
        run: |
          docker compose logs --tail 200

      - name: Clean up
        if: always()
        run: |
          docker compose down -v