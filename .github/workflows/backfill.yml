name: AQI Backfill Pipeline (Airflow via Docker)

on:
  workflow_dispatch:
    inputs:
      months:
        description: "Nombre de mois d'historique à récupérer"
        required: true
        default: "12"

permissions:
  contents: write

concurrency:
  group: aqi-backfill
  cancel-in-progress: false

jobs:
  run-backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix permissions for mounted volumes
        run: |
          mkdir -p raw clean logs plugins docs config
          sudo chown -R 50000:0 raw clean logs plugins docs config
          sudo chmod -R 775 raw clean logs plugins docs config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file
        run: |
          echo "OPENWEATHER_API_KEY=${{ secrets.OPENWEATHER_API_KEY }}" >> .env
          echo "DATABASE_URL=${{ secrets.NEON_DATABASE_URL }}" >> .env
          echo "DATABASE_URL_WRITER=${{ secrets.NEON_DATABASE_URL_WRITER }}" >> .env
          echo "AIRFLOW_UID=50000" >> .env

      - name: Build image with cache
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            air-quality-pipeline-airflow-scheduler:latest
            air-quality-pipeline-airflow-init:latest
            air-quality-pipeline-airflow-webserver:latest
            air-quality-pipeline-pipeline:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start Airflow with Docker Compose
        run: |
          docker compose up -d --wait --wait-timeout 180

      - name: Check container status
        run: |
          docker compose ps

      - name: Run backfill
        run: |
          docker compose exec -T airflow-webserver \
            airflow dags backfill aqi_pipeline \
            -s "${{ inputs.start_date }}" \
            -e "${{ inputs.end_date }}" \
            --reset-dagruns -y

      - name: Commit raw/ et clean/ produits par le backfill
        run: |
          git config user.name "aqi-bot"
          git config user.email "aqi-bot@users.noreply.github.com"
          git config core.fileMode false
          git add raw/ clean/
          git diff --staged --quiet || git commit -m "chore: backfill ${{ inputs.start_date }} -> ${{ inputs.end_date }}"
          git pull --rebase
          git push

      - name: Show logs
        if: always()
        run: |
          docker compose logs --tail 200

      - name: Clean up
        if: always()
        run: |
          docker compose down -v