name: AQI Pipeline (Airflow via Docker)

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aqi-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file
        run: |
          echo "OPENWEATHER_API_KEY=${{ secrets.OPENWEATHER_API_KEY }}" >> .env
          echo "DATABASE_URL=${{ secrets.NEON_DATABASE_URL }}" >> .env
          echo "DATABASE_URL_WRITER=${{ secrets.NEON_DATABASE_URL }}" >> .env
          echo "AIRFLOW_UID=50000" >> .env

      - name: Start Airflow with Docker Compose
        run: |
          docker compose up -d --wait --wait-timeout 180

      - name: Check container status
        run: |
          docker compose ps

      - name: Run DAG synchronously
        run: |
          docker compose exec -T airflow-webserver \
            airflow dags test aqi_pipeline "$(date -u +'%Y-%m-%d')"

      - name: Commit clean/ produit par le run
        run: |
          git config user.name "aqi-bot"
          git config user.email "aqi-bot@users.noreply.github.com"
          git add clean/
          git diff --staged --quiet || git commit -m "chore: sync clean $(date -u +'%Y-%m-%dT%H:%M')"
          git pull --rebase
          git push

      - name: Show logs
        if: always()
        run: |
          docker compose logs --tail 200

      - name: Clean up
        if: always()
        run: |
          docker compose down -v